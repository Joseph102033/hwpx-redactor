# 중대재해보고서 공개본 변환 설정 — 문서마다 이 파일만 수정하면 됩니다.
# (1페이지 사업장개요표 + 재해자 인적사항표를 보고 이름/회사명만 채우세요)

input:  "재해원인조사의견서.hwpx"      # 원본 파일 경로
output: ""                              # 비우면 자동으로 _공개본.hwpx

# 사람 이름 (등장 순서대로 A,B,C... 자동 부여)
재해자:  [홍길동, 김철수]                 # -> 재해자A, B
사업주:  [이영희]                         # -> 사업주A (대표자)
조사자:  [박조사, 최조사]                 # -> 공란(삭제)

# 공개는 유지하되 텍스트 검색은 막을 회사명(원·하청) -> 이미지로 대체
회사명_이미지화: ["가나산업(주)", "가나산업", "(주)다라건설", "다라건설"]

# 라벨 포함 통째 삭제할 정확한 문자열 (산재/사업자/사업개시번호 등)
삭제문자열:
  - "12345678901"
  - "(00000000000)"

# 자동 처리 (대개 손댈 필요 없음)
직종칼럼삭제: true        # '직종' 헤더 표의 해당 칼럼 비우기
직종헤더: "직종"

# 자동: 주민번호->출생년도, 전화/팩스 삭제, 소재지 시·구화 (코드가 알아서 처리)
# 추가 임의 치환이 필요하면:
# 기타치환:
#   "어떤문자열": "바꿀값"
